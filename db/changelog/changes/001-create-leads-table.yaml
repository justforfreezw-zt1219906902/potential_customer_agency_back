databaseChangeLog:
  - changeSet:
      id: 001-create-leads-table
      author: codex
      changes:
        - createTable:
            tableName: leads
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: company
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: website
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: VARCHAR(100)
              - column:
                  name: hubspot_contact_id
                  type: VARCHAR(100)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: leads
            indexName: idx_leads_email
            columns:
              - column:
                  name: email
